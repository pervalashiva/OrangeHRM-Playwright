name: Playwright Tests

on:
  push:
    branches: [main, master, feature/**]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      test_selection:
        description: 'Which tests to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - launch-login-page
          - valid-login
          - invalid-credentials
          - empty-credentials
          - forgot-password
          - add-user
          - add-job-title
      headed:
        description: 'Run headed (visible browser) — usually leave false in CI'
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: Run Playwright (${{ github.event.inputs.test_selection || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java (required for Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Clean previous Allure results
        run: rm -rf allure-results allure-report

      - name: Resolve test command
        id: resolve
        shell: bash
        run: |
          SELECTION="${{ github.event.inputs.test_selection || 'all' }}"
          HEADED_FLAG=""
          if [ "${{ github.event.inputs.headed }}" = "true" ]; then
            HEADED_FLAG="--headed"
          fi

          case "$SELECTION" in
            all)
              CMD="npx playwright test $HEADED_FLAG"
              ;;
            launch-login-page)
              CMD="npx playwright test -g \"should launch the website and open the login page\" $HEADED_FLAG"
              ;;
            valid-login)
              CMD="npx playwright test -g \"should login successfully with valid credentials\" $HEADED_FLAG"
              ;;
            invalid-credentials)
              CMD="npx playwright test -g \"should show error for invalid credentials\" $HEADED_FLAG"
              ;;
            empty-credentials)
              CMD="npx playwright test -g \"should show required field validation when credentials are empty\" $HEADED_FLAG"
              ;;
            forgot-password)
              CMD="npx playwright test -g \"should navigate to forgot password page\" $HEADED_FLAG"
              ;;
            add-user)
              CMD="npx playwright test -g \"should add a new system user after login via Admin > Add\" $HEADED_FLAG"
              ;;
            add-job-title)
              CMD="npx playwright test -g \"should add a job title with details, file upload, save and verify\" $HEADED_FLAG"
              ;;
            *)
              echo "Unknown selection: $SELECTION"
              exit 1
              ;;
          esac

          echo "selection=$SELECTION" >> "$GITHUB_OUTPUT"
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"
          echo "Running: $CMD"

      - name: Run tests
        id: tests
        continue-on-error: true
        run: ${{ steps.resolve.outputs.cmd }}

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ steps.resolve.outputs.selection }}-${{ github.run_id }}
          path: allure-report/
          retention-days: 30

      - name: Upload Allure raw results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ steps.resolve.outputs.selection }}-${{ github.run_id }}
          path: allure-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ steps.resolve.outputs.selection }}-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test results (screenshots/videos/traces)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ steps.resolve.outputs.selection }}-${{ github.run_id }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail job if tests failed
        if: ${{ steps.tests.outcome == 'failure' }}
        run: |
          echo "Tests failed. Allure report was still generated and uploaded."
          exit 1
